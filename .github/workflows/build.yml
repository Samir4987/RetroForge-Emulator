
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/gba-core-integration, feature/gb-gbc-runtime-audit-fixes]
  pull_request:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      GRADLE_VERSION: "9.3.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Bootstrap missing Gradle wrapper JAR
        shell: bash
        run: |
          set -euxo pipefail

          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR already exists."
            exit 0
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          cd "$TEMP_DIR"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O gradle.zip

          unzip -q gradle.zip

          mkdir wrapper-project
          cd wrapper-project

          printf 'rootProject.name = "wrapper-bootstrap"\n' > settings.gradle
          printf '// Temporary wrapper bootstrap project\n' > build.gradle

          "../gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -s gradle/wrapper/gradle-wrapper.jar

          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

          test -s "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/google-services.json
          python3 - <<'PY'
          import json

          path = "app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          expected = "com.aistudio.retroforge.gkqwnx"
          clients = data.get("client", [])
          matches = [
              c for c in clients
              if c.get("client_info", {}).get(
                  "android_client_info", {}
              ).get("package_name") == expected
          ]

          if not matches:
              raise SystemExit(
                  f"No Firebase Android client matches {expected}"
              )

          web_clients = [
              oauth for client in matches
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 3
          ]

          if not web_clients:
              raise SystemExit(
                  "No web OAuth client (client_type 3) found"
              )

          print("Firebase package and web OAuth client verified.")
          PY

      - name: Generate Firebase resources
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon :app:processDebugGoogleServices

      - name: Check generated Firebase resources
        if: always()
        shell: bash
        run: |
          echo "Generated Google Services files:"
          find app/build/generated/res/google-services \
            -type f -print 2>/dev/null || true

          echo "Searching for default_web_client_id:"
          grep -R -n "default_web_client_id" \
            app/build/generated/res/google-services \
            2>/dev/null || true

      - name: Run unit tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build and package pinned mGBA Libretro core
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$PATH"
          bash scripts/build-mgba-android.sh

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroForge-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
