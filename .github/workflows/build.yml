
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/n3ds-android-integration]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "firebase.json"
      - "firestore.rules"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "firebase.json"
      - "firestore.rules"
      - ".github/workflows/build.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: retroforge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      GRADLE_VERSION: "9.3.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6"

      - name: Bootstrap missing Gradle wrapper JAR
        shell: bash
        run: |
          set -euxo pipefail

          if [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR already exists."
            exit 0
          fi

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          cd "$TEMP_DIR"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O gradle.zip

          unzip -q gradle.zip

          mkdir wrapper-project
          cd wrapper-project

          printf 'rootProject.name = "wrapper-bootstrap"\n' > settings.gradle
          printf '// Temporary wrapper bootstrap project\n' > build.gradle

          "../gradle-${GRADLE_VERSION}/bin/gradle" wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          test -s gradle/wrapper/gradle-wrapper.jar

          mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar \
            "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

          test -s "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Verify Firebase configuration
        shell: bash
        run: |
          set -euxo pipefail
          test -s app/google-services.json
          python3 - <<'PY'
          import json

          path = "app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          expected = "com.aistudio.retroforge.gkqwnx"
          clients = data.get("client", [])
          matches = [
              c for c in clients
              if c.get("client_info", {}).get(
                  "android_client_info", {}
              ).get("package_name") == expected
          ]

          if not matches:
              raise SystemExit(
                  f"No Firebase Android client matches {expected}"
              )

          web_clients = [
              oauth for client in matches
              for oauth in client.get("oauth_client", [])
              if oauth.get("client_type") == 3
          ]

          if not web_clients:
              raise SystemExit(
                  "No web OAuth client (client_type 3) found"
              )

          print("Firebase package and web OAuth client verified.")
          PY

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Firebase resources
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:processDebugGoogleServices

      - name: Check generated Firebase resources
        if: always()
        shell: bash
        run: |
          echo "Generated Google Services files:"
          find app/build/generated/res/google-services \
            -type f -print 2>/dev/null || true

          echo "Searching for default_web_client_id:"
          grep -R -n "default_web_client_id" \
            app/build/generated/res/google-services \
            2>/dev/null || true

      - name: Download verified Azahar core artifact
        id: download_azahar
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: azahar-libretro-android-arm64
          path: .build/azahar-artifacts/arm64-v8a
          repository: ${{ github.repository }}
          run-id: 41200970352
          github-token: ${{ github.token }}

      - name: Build Azahar core if the cached artifact is unavailable
        if: steps.download_azahar.outcome == 'failure'
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          export PATH="$ANDROID_SDK_ROOT/cmake/3.31.6/bin:$PATH"
          export ANDROID_ABI="arm64-v8a"
          export BUILD_JOBS="2"
          bash ./scripts/build-azahar-android.sh

      - name: Verify pinned Azahar core and license metadata
        shell: bash
        run: |
          set -euxo pipefail
          ARTIFACT_DIR=.build/azahar-artifacts/arm64-v8a
          test -s "$ARTIFACT_DIR/azahar_libretro.so"
          test -s "$ARTIFACT_DIR/AZAHAR-LICENSE.txt"
          test -s "$ARTIFACT_DIR/AZAHAR-REVISION.txt"
          test "$(tr -d '\r\n' < "$ARTIFACT_DIR/AZAHAR-REVISION.txt")" = "01623d2fb707317410225c0eced82e3e0c84edc1"
          if [ -s "$ARTIFACT_DIR/AZAHAR-SHA256.txt" ]; then
            EXPECTED_SHA="$(tr -d '\r\n' < "$ARTIFACT_DIR/AZAHAR-SHA256.txt")"
          else
            # The first pinned artifact predates the SHA manifest; pin its verified binary hash.
            EXPECTED_SHA="054c68d193b31b4cc19a76c8949fa1d7e54bd1f8c5c5927d63e5e7603b840874"
            printf '%s\n' "$EXPECTED_SHA" > "$ARTIFACT_DIR/AZAHAR-SHA256.txt"
          fi
          ACTUAL_SHA="$(sha256sum "$ARTIFACT_DIR/azahar_libretro.so" | cut -d' ' -f1)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Build 3DS-enabled debug APK and run tests
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:stageAzaharCore testDebugUnitTest assembleDebug

      - name: Verify APK includes Azahar, C++ runtime and GPL notices
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/azahar_libretro.so'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$APK" | grep -F 'assets/licenses/azahar/AZAHAR-LICENSE.txt'
          unzip -l "$APK" | grep -F 'assets/licenses/azahar/AZAHAR-REVISION.txt'
          ls -lh "$APK"

      - name: Upload 3DS-enabled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroForge-Android-APK-with-Azahar-3DS
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
