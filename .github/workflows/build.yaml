name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_HOME"
          cd "$ANDROID_HOME"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
            unzip -q -o cmdtools.zip
            rm -f cmdtools.zip

            if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
              mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
              shopt -s dotglob nullglob
              for entry in "$ANDROID_HOME/cmdline-tools"/*; do
                if [ "$entry" != "$ANDROID_HOME/cmdline-tools/latest" ]; then
                  mv "$entry" "$ANDROID_HOME/cmdline-tools/latest/"
                fi
              done
            fi
          fi

          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euxo pipefail
          ls -l
          test -f ./gradlew
          chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          bash ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroForge-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
